spring.application.name=apiProyecto
server.port=${PORT:8080}

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=apiproyecto

# Crea el indice unico del email automaticamente
spring.data.mongodb.auto-index-creation=true

# Muestra el motivo del error en las respuestas de la API
server.error.include-message=always

# Solo para correr en tu PC (archivo ignorado por git)
spring.config.import=optional:classpath:application-local.properties

# IA gratuita para generar preguntas nuevas (Groq). Crea tu clave gratis en https://console.groq.com/keys
# y guardala en la variable de entorno GROQ_API_KEY (en Railway: Variables). Sin clave, la app usa sus preguntas locales.
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.cache.minutos=15
