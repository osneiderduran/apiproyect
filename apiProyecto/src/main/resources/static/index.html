<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reto Diario — pequeños retos, grandes cambios</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0e44">
<meta name="description" content="Retos diarios físicos, mentales, creativos y de aprendizaje. Gana XP, mantén tu racha y mejora un día a la vez.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reto Diario">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--nv:#090c3a;--ac:#6c4cff;--ac2:#8f74ff;--ok:#16a34a;--okbg:#dcfce7;--er:#dc2626;--erbg:#fee2e2;--gold:#fbbf24;--fire:#ff7a2f;
--dmu:#a9aedf;--dbd:rgba(255,255,255,.13);
--lbg:#f6f7ff;--lcard:#fff;--ltx:#1b1f4b;--lmu:#6f759b;--lbd:#e5e8f6;--lsel:#efeaff}
body.dk{--lbg:#0d1250;--lcard:#171f73;--ltx:#f2f3ff;--lmu:#aab0e0;--lbd:#2b3496;--lsel:#2a2c92;--okbg:#0f3d2e;--erbg:#4a1d2c}
body.hc{--dmu:#d6d9ff;--lmu:#3a3f68;--lbd:#8b92c0}
body.hc.dk{--lmu:#e0e3ff;--lbd:#6d76d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#04061f}
body{font:16px/1.45 ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;letter-spacing:-.005em}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
p{margin:0}
h1,h2,h3{margin:0;line-height:1.15}
#app{max-width:440px;min-height:100vh;min-height:100dvh;margin:0 auto;position:relative;overflow:hidden;background:var(--nv)}
@media(min-width:520px){#app{box-shadow:0 0 0 1px #ffffff14,0 30px 80px #000a}}
svg{display:block}

/* pantallas */
.scr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0)}
.scr.dark{background:radial-gradient(120% 60% at 50% 0,#1b1580 0,transparent 60%),linear-gradient(180deg,#0a0e44,#0a0f4d 55%,#070a35);color:#fff}
.scr.light{background:var(--lbg);color:var(--ltx)}
.pad{padding:18px 20px}
.grow{flex:1}
.mu{color:var(--dmu);font-size:14px}
.light .mu,.sheet .mu{color:var(--lmu)}
.row{display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand i{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#8f74ff,#5b3cf0);display:grid;place-items:center;color:#fff}

/* botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 18px;border-radius:18px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(180deg,#7d5cff,#5a3be6);box-shadow:0 5px 0 #3a22b0,0 14px 24px #5a3be640;transition:transform .12s,box-shadow .12s;margin-top:14px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3a22b0}
.btn:disabled{opacity:.6}
.btn.ghost{background:transparent;border:2px solid #7f68ff;color:#fff;box-shadow:none}
.btn.ghost:active{transform:scale(.99)}
.btn.sm{min-height:42px;border-radius:14px;font-size:14px;width:auto;margin:0;padding:0 16px;box-shadow:0 3px 0 #3a22b0}
.btn.gold{background:linear-gradient(180deg,#ffd45c,#ffb21e);color:#3a2576;box-shadow:0 5px 0 #c98200}
.btn.plain{background:var(--lcard);color:var(--ltx);border:2px solid var(--lbd);box-shadow:none}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff;position:relative}
.light .iconbtn{background:var(--lcard);color:var(--ltx);border:1px solid var(--lbd)}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#ff5a7a}

/* bienvenida */
.welcome{background:linear-gradient(180deg,#1a1050 0,#43228f 38%,#c4507a 70%,#ff9a62 100%)!important}
.welcome .stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 14%,#fff8,transparent),radial-gradient(2px 2px at 78% 10%,#fff9,transparent),radial-gradient(1.5px 1.5px at 60% 24%,#fff7,transparent),radial-gradient(1.5px 1.5px at 10% 34%,#fff6,transparent),radial-gradient(2px 2px at 90% 30%,#fff7,transparent)}
.welcome .mount{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none}
.welcome .mount svg{width:100%;height:100%}
.welcome .inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:22px 24px calc(22px + env(safe-area-inset-bottom,0))}
.mascot-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:240px;animation:float 4.5s ease-in-out infinite}
.mascot-wrap svg{width:min(78%,300px);height:auto;filter:drop-shadow(0 18px 24px #1a0a5080)}
@keyframes float{50%{transform:translateY(-8px)}}
.w-title{text-align:center;font-size:32px;font-weight:900;letter-spacing:-.8px}
.w-title span{display:block;background:linear-gradient(90deg,#ffd45c,#ff9a62 60%,#ff6fa0);-webkit-background-clip:text;background-clip:text;color:transparent}
.w-sub{text-align:center;color:#ece8ff;font-size:15px;margin:10px auto 6px;max-width:300px}
.w-foot{text-align:center;font-size:12px;color:#fff9;margin-top:16px}
.w-foot b{color:#ff7aa8}

/* auth */
.field{width:100%;height:54px;border-radius:16px;border:2px solid var(--dbd);background:rgba(255,255,255,.07);padding:0 16px;margin-top:12px;outline:none;color:#fff;font-size:16px}
.field::placeholder{color:#fff8}
.field:focus{border-color:#8f74ff;background:rgba(255,255,255,.11)}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:16px;padding:4px;margin-top:20px}
.seg button{flex:1;height:42px;border-radius:12px;font-weight:800;color:var(--dmu);font-size:14px}
.seg button.on{background:#6c4cff;color:#fff;box-shadow:0 4px 12px #6c4cff55}
.err{background:#ff4d6d26;border:1px solid #ff4d6d66;color:#ffd5dd;border-radius:14px;padding:11px 14px;font-size:14px;margin-top:14px}
.light .err{color:#9f1239;background:var(--erbg);border-color:#fca5a5}

/* Acceso v19: correo primero, proveedores sociales después */
.auth-screen{overflow-y:auto;overscroll-behavior:contain}
.auth-pad{width:100%;max-width:460px;margin:0 auto;padding-left:22px;padding-right:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0))}
.auth-mascot{width:clamp(78px,22vw,112px);height:clamp(78px,22vw,112px);margin:0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center}
.auth-mascot svg{width:100%;height:100%}
.auth-seg{margin-top:14px}
.auth-pad .field{height:49px;margin-top:10px;border-radius:14px}
.forgot-row{display:flex;justify-content:flex-end;margin-top:8px}
.forgot-row button{font-size:13px;color:#b8a8ff;font-weight:700;padding:5px 0}
.auth-submit{margin-top:13px;width:100%}
.social-divider{display:flex;align-items:center;gap:10px;margin:17px 0 12px;color:var(--dmu)}
.social-divider span{height:1px;flex:1;background:var(--dbd)}
.social-divider small{font-size:10px;letter-spacing:1px;font-weight:800;white-space:nowrap}
.social-btn{width:100%;min-height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:11px;font-size:14px;font-weight:800;margin-top:9px;border:1px solid transparent}
.google-btn{background:#fff;color:#202124;border-color:#dadce0}
.facebook-btn{background:#1877f2;color:#fff}
.social-g{font-weight:900;font-size:19px;background:conic-gradient(from -45deg,#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 75%,#ea4335 0);color:transparent;background-clip:text;-webkit-background-clip:text}
.social-f{font-family:Arial,sans-serif;font-size:23px;font-weight:900;color:#fff}
.auth-note{font-size:10px;line-height:1.4;color:var(--dmu);text-align:center;margin:13px 8px 0}
@media(max-height:720px){.auth-mascot{width:68px;height:68px}.auth-pad{padding-top:10px!important}.auth-pad .field{height:45px}.auth-seg{margin-top:9px}.social-divider{margin:11px 0 8px}.social-btn{min-height:43px;margin-top:7px}}

/* onboarding categorias */
.h1{font-size:27px;font-weight:900;letter-spacing:-.6px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.ccard{position:relative;text-align:left;background:var(--lcard);border:2px solid var(--lbd);border-radius:20px;padding:14px;min-height:132px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 16px #2a2f8012;transition:transform .12s,border-color .12s}
.ccard:active{transform:scale(.98)}
.ccard.on{border-color:#6c4cff;background:var(--lsel)}
.ccard b{font-size:16px;font-weight:800;margin-top:auto}
.ccard small{font-size:12px;color:var(--lmu);line-height:1.3}
.ccard .tick{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:#6c4cff;color:#fff;display:grid;place-items:center;transform:scale(0);transition:transform .15s}
.ccard.on .tick{transform:scale(1)}
.cico{width:48px;height:48px}

/* inicio */
.hi{display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
.hi .avatar{padding:3px;overflow:hidden}.hi .avatar svg{width:100%;height:100%}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#7d5cff,#35c78a);display:grid;place-items:center;font-weight:900;border:2px solid #ffffff55;flex:none}
.hello h1{font-size:23px;font-weight:900}
.card-d{background:rgba(255,255,255,.08);border:1px solid var(--dbd);border-radius:20px}
.lvl{margin:12px 18px 0;padding:14px;background:#fff;color:#1b1f4b;border-radius:20px;box-shadow:0 10px 24px #0005}
.lvl .t{display:flex;align-items:center;gap:12px}
.lvl .st{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ffd45c,#ff9f1c);display:grid;place-items:center;color:#fff;box-shadow:0 4px 0 #d9830a}
.xpbar{height:10px;border-radius:99px;background:#e6e8fa;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7d5cff,#c86bff);transition:width .5s}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 18px 0}
.tile{padding:10px 8px;text-align:center;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid var(--dbd)}
.tile .ti{margin:0 auto 4px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center}
.tile b{display:block;font-size:19px;font-weight:900;line-height:1.1}
.tile small{font-size:11px;color:var(--dmu)}
.hero{margin:14px 18px 0;border-radius:24px;overflow:hidden;position:relative;min-height:156px;padding:16px;background:linear-gradient(160deg,#2c5bd8 0,#2fa8a0 55%,#4ade80 100%);box-shadow:0 12px 26px #0006}
.hero:before{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:90px;background:#1e9b6a;border-radius:50% 50% 0 0}
.hero .tx{position:relative;z-index:2;max-width:58%}
.hero .tag{font-size:12px;font-weight:800;letter-spacing:.04em;color:#e6fff3}
.hero h2{font-size:20px;font-weight:900;margin:4px 0 2px}
.hero p{font-size:12.5px;color:#eafff4;line-height:1.3;margin-bottom:12px}
.hero .cham{position:absolute;right:-18px;bottom:-6px;width:50%;z-index:1}
.hero .btn{position:relative;z-index:2}
.sheet{background:var(--lbg);color:var(--ltx);border-radius:28px 28px 0 0;margin-top:16px;padding:18px 18px 8px;flex:1}
.sheet h3{font-size:17px;font-weight:900}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:16px;background:var(--lcard);border:2px solid var(--lbd);font-size:11.5px;font-weight:700;color:var(--ltx);transition:transform .1s}
.chip:active{transform:scale(.96)}
.chip svg{width:34px;height:34px}
.rt{display:flex;align-items:center;gap:12px;padding:12px;margin-top:10px;background:var(--lcard);border:2px solid var(--lbd);border-radius:18px;width:100%;text-align:left}
.rt .ri{width:46px;height:46px;display:grid;place-items:center;flex:none}
.rt .ri svg{width:46px;height:46px}
.rt .rb{flex:1;min-width:0}
.rt b{display:block;font-size:15px;font-weight:800;line-height:1.2}
.rt small{font-size:12px;color:var(--lmu)}
.rt .xp{font-weight:900;color:#6c4cff;font-size:13px;white-space:nowrap}
.rt.done{opacity:.7}
.rt.done .xp{color:var(--ok)}
.empty{padding:22px 10px;text-align:center;color:var(--lmu);font-size:14px}

/* nav */
.nav{position:fixed;left:calc(50% - min(50%,220px));width:min(100%,440px);bottom:0;z-index:5;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0));background:var(--lcard);border-top:1px solid var(--lbd)}
.nav.d{background:#0a0e44;border-color:var(--dbd)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--lmu);border-radius:14px}
.nav.d button{color:var(--dmu)}
.nav button.on{color:#6c4cff}
.nav.d button.on{color:#a994ff}

/* drawer */
.veil{position:fixed;top:0;bottom:0;left:calc(50% - min(50%,220px));width:min(100%,440px);background:#0009;z-index:20;animation:fade .2s}
.drawer{position:fixed;left:calc(50% - min(50%,220px));top:0;bottom:0;width:min(78%,330px);z-index:21;background:linear-gradient(180deg,#0a0f50,#080b3a);padding:calc(18px + env(safe-area-inset-top,0)) 14px 18px;display:flex;flex-direction:column;animation:slide .25s ease-out;box-shadow:10px 0 40px #000a;overflow:hidden}
@keyframes slide{from{transform:translateX(-100%)}}
@keyframes fade{from{opacity:0}}
.dhead{display:flex;align-items:center;gap:12px;padding:6px 4px 18px}
.dhead .avatar{width:54px;height:54px;font-size:20px}
.dhead small{color:var(--dmu);font-size:12px;word-break:break-all}
.ditem{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:14px;font-weight:700;font-size:14.5px;color:#e8e9ff;text-align:left}
.ditem.on{background:#6c4cff;color:#fff}
.dsep{height:1px;background:var(--dbd);margin:10px 4px}
.dfoot{margin-top:auto;text-align:center;font-size:13px;color:var(--dmu);position:relative;z-index:2;padding:0 12px}
.dmount{position:absolute;left:0;right:0;bottom:0;height:150px;opacity:.7}

/* juego */
.banner{height:150px;position:relative;overflow:hidden;border-radius:0 0 30px 30px;flex:none}
.banner .top{position:absolute;left:14px;right:14px;top:calc(12px + env(safe-area-inset-top,0));display:flex;justify-content:space-between;align-items:center;z-index:3}
.banner .iconbtn{background:#ffffff40;color:#fff;border:0;backdrop-filter:blur(6px)}
.banner .big svg{width:100%;height:100%}
.banner .deco{position:absolute;inset:0}
.banner .big{position:absolute;right:18px;bottom:-6px;width:128px;height:128px;opacity:.95;filter:drop-shadow(0 8px 12px #0004)}
.step{position:absolute;left:14px;bottom:14px;z-index:3;display:flex;align-items:center;gap:8px}
.step b{background:#ffffff38;border-radius:99px;padding:3px 10px;font-size:12px}
.step .pb{width:90px;height:7px;border-radius:99px;background:#ffffff40;overflow:hidden}
.step .pb i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.tag{display:inline-block;align-self:flex-start;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:800;color:#fff}
.play{padding:16px 18px 20px;flex:1;display:flex;flex-direction:column}
.play h2{font-size:21px;font-weight:900;margin-top:8px}
.play .sub{font-size:14px;color:var(--lmu);margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-top:10px;border-radius:16px;background:var(--lcard);border:2px solid var(--lbd);font-weight:700;font-size:15px;text-align:left;color:var(--ltx);transition:border-color .12s,background .12s}
.opt i{width:22px;height:22px;border-radius:50%;border:2px solid var(--lbd);flex:none;display:grid;place-items:center;color:#fff}
.opt.sel{border-color:#6c4cff;background:var(--lsel)}
.opt.sel i{background:#6c4cff;border-color:#6c4cff}
.opt.good{border-color:#22c55e;background:var(--okbg)}
.opt.good i{background:#22c55e;border-color:#22c55e}
.opt.bad{border-color:#ef4444;background:var(--erbg)}
.opt.bad i{background:#ef4444;border-color:#ef4444}
.opt:disabled{cursor:default}
.eq{margin-top:14px;padding:18px;border-radius:18px;background:var(--lsel);text-align:center;font-size:30px;font-weight:900;letter-spacing:1px}
.fb{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:18px;border:2px solid}
.fb.ok{background:var(--okbg);border-color:#86efac}.fb.no{background:var(--erbg);border-color:#fca5a5}
.fb svg{width:46px;height:46px;flex:none}
.fb b{font-size:16px;display:block}
.fb small{color:var(--lmu);font-size:13px}
.timer{margin:22px auto 6px;width:210px;height:210px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#6c4cff var(--p,0%),var(--lbd) 0);position:relative}
.timer:before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--lbg)}
.timer span{position:relative;font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}
.canvas-wrap{margin-top:14px;border-radius:20px;overflow:hidden;border:2px dashed #b9a9ff;background:#fff;touch-action:none}
canvas{display:block;width:100%;height:220px;touch-action:none}
.palette{display:flex;gap:10px;margin-top:12px;align-items:center}
.palette button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--lbd)}
.palette button.on{box-shadow:0 0 0 3px #6c4cff}
.palette .clr{margin-left:auto;width:auto;height:auto;border:0;box-shadow:none;font-size:13px;font-weight:800;color:var(--lmu);border-radius:0}
.field.l{background:var(--lcard);border-color:var(--lbd);color:var(--ltx)}
.field.l::placeholder{color:var(--lmu)}
.bottomact{margin-top:auto;padding-top:10px}
.hint{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--lmu)}

/* resultado */
.fin{background:linear-gradient(180deg,#1a1050,#4a24a0 55%,#0a0e44)!important;text-align:center;align-items:center}
.fin .inner{padding:30px 24px;flex:1;display:flex;flex-direction:column;align-items:center;width:100%}
.fin .mascot-wrap{flex:none;min-height:0;margin-top:20px}
.done .mascot-wrap svg{width:230px}
.fin h1{font-size:30px;font-weight:900;margin-top:10px}
.xpbadge{margin:16px 0 6px;display:inline-flex;align-items:center;gap:8px;background:#ffffff1f;border:1px solid #ffffff40;border-radius:99px;padding:10px 20px;font-size:22px;font-weight:900;color:#ffd45c}

/* estadisticas */
.tabs{display:flex;gap:6px;padding:4px;background:rgba(255,255,255,.08);border-radius:14px}
.tabs button{flex:1;height:36px;border-radius:10px;font-size:13px;font-weight:800;color:var(--dmu)}
.tabs button.on{background:#6c4cff;color:#fff}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#8f74ff var(--p),#ffffff1f 0);position:relative;flex:none}
.ring:before{content:"";position:absolute;inset:14px;border-radius:50%;background:#0b1050}
.ring div{position:relative;text-align:center}
.ring b{font-size:30px;font-weight:900;display:block;line-height:1}
.ring small{font-size:11px;color:var(--dmu)}
.kv{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.kv .ki{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none}
.kv small{display:block;color:var(--dmu);font-size:11.5px;line-height:1.1}
.kv b{font-size:18px;font-weight:900}
.bars{display:flex;align-items:flex-end;gap:7px;height:120px;margin-top:14px}
.catg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.catg div{display:flex;flex-direction:column;align-items:center;gap:6px;background:#ffffff0d;border-radius:16px;padding:12px 4px}
.catg b{font-size:20px}
.catg small{font-size:11px;color:var(--dmu)}

function mathQ(){
  var t = rnd(0, 2), a, b, c, txt, ans;
  if(t === 0){ a = rnd(5, 20); b = rnd(2, 9); c = rnd(2, 5); txt = a + " + " + b + " × " + c; ans = a + b * c; }
  else if(t === 1){ a = rnd(3, 9); b = rnd(3, 9); c = rnd(1, 12); txt = a + " × " + b + " − " + c; ans = a * b - c; }
  else { a = rnd(2, 9); b = rnd(2, 9); c = rnd(2, 6); txt = "(" + a + " + " + b + ") × " + c; ans = (a + b) * c; }
  var set = {}; set[ans] = 1; var opts = [ans];
  while(opts.length < 4){ var d = ans + rnd(-9, 9); if(d > 0 && !set[d]){ set[d] = 1; opts.push(d); } }
  return {q:"¿Cuál es el resultado de esta operación?", eq:txt + " = ?", o:shuffle(opts).map(String), a:String(ans)};
}

function retoSorpresa(){

  saved = {fecha:hoy(), game:chosen.id, titulo:chosen.n, cat:chosen.cat};
  save(key, saved);

}
function semanaActual(){

function puntosSemana(){

  hist().forEach(function(x){ if(x.fecha >= start) seen[x.fecha + "|" + (x.retoId || x.titulo || x.id)] = true; });

function rangoDatos(n){
  var set = fechasSet(), out = [], d, i;
  var xpPorFecha = {}; hist().forEach(function(c){ xpPorFecha[c.fecha] = (xpPorFecha[c.fecha] || 0) + (c.xp || 0); });
  var activos = 0, xp = 0, retos = 0;
  var dias = []; for(i = n - 1; i >= 0; i--){ d = new Date(); d.setDate(d.getDate() - i); dias.push(fechaDe(d)); }
  dias.forEach(function(f){ if(set[f]){ activos++; retos += set[f]; xp += xpPorFecha[f]; } });
  var bars = [];
  if(n === 7){
    var nom = ["D","L","M","M","J","V","S"];
    dias.forEach(function(f){ bars.push({v:set[f] || 0, l:nom[new Date(f + "T12:00:00").getDay()]}); });
  } else if(n === 365){
    var meses = ["E","F","M","A","M","J","J","A","S","O","N","D"], base = new Date();
    for(i = 11; i >= 0; i--){
      var m = new Date(base.getFullYear(), base.getMonth() - i, 1), key = fechaDe(m).slice(0, 7), t = 0;
      Object.keys(set).forEach(function(f){ if(f.slice(0, 7) === key) t += set[f]; });
      bars.push({v:t, l:meses[m.getMonth()]});
    }
  } else {
    var g = n === 30 ? 3 : 10, k;
    for(k = 0; k < dias.length; k += g){
      var t2 = 0; dias.slice(k, k + g).forEach(function(f){ t2 += set[f] || 0; });
      bars.push({v:t2, l:dias[k].slice(8) + "/" + dias[k].slice(5, 7)});
    }
  }
  return {pct:Math.round(activos / n * 100), xp:xp, retos:retos, bars:bars};
}

    '<div class="dsep"></div>' + it("gear", "Configuración", "view", "ajustes", v === "ajustes") + it("help", "Ayuda", "soon", "ayuda") + it("out", "Cerrar sesión", "logout", "") +
    '<div class="dfoot"><div class="dmount">' + mountains() + '</div><p style="position:relative;margin-bottom:46px"></p></div></aside>';
}
function render(){
  var v = S.view, ae = document.activeElement, keep = ae && ae.id ? {id:ae.id, s:ae.selectionStart} : null;
  var html;
  if(!S.user && ["welcome","auth"].indexOf(v) < 0) v = S.view = "welcome";
  switch(v){
    case "welcome": html = welcome(); break;
    case "auth": html = auth(); break;
    case "onboard": html = onboard(); break;
    case "home": html = home(); break;
    case "retos": html = retosView(); break;
    case "play": html = S.play ? play() : home(); break;
    case "done": html = S.done ? doneView() : home(); break;
    case "stats": html = stats(); break;
    case "insignias": html = insig(); break;
    case "racha": html = rachaView(); break;
    case "ajustes": html = ajustes(); break;
    case "ranking": html = ranking(); break;
    case "cal": html = calendario(); break;
    case "cham": html = camView(); break;
    case "tienda": html = tienda(); break;
    case "bugs": html = bugsView(); break;
    case "ruleta": html = ruletaView(); break;
    case "aventura": html = aventura(); break;
    case "liga": html = liga(); break;
    default: html = perfil();
  }
  var sc = window.pageYOffset;
  var _chg = S._lv !== v; S._lv = v;
  document.getElementById("app").innerHTML = html + (S.drawer ? drawer() : "") + (S.toast ? '<div class="toast">' + esc(S.toast) + '</div>' : "");
  if(_chg){ var _f = document.querySelector("#app>.scr"); if(_f) _f.classList.add("enter"); }
  document.querySelector('meta[name="theme-color"]').setAttribute("content", v === "play" || v === "retos" || v === "perfil" ? "#6c4cff" : "#0a0e44");
  if(keep){ var el = document.getElementById(keep.id); if(el){ el.focus(); try{ el.setSelectionRange(keep.s, keep.s); }catch(e){} } }
  if(v === "play") setupPlay();
  if(v !== "play" && v !== "welcome") window.scrollTo(0, sc);
}

var BACK = "home";
function go(v){ if(S.view === "bugs" && v !== "bugs"){ stopBugs(); BUG = null; } S.drawer = false; S.err = ""; if(v === "ranking" && S.view !== "ranking"){ S.ranking = null; cargarRanking(); } if(["insignias","racha","ajustes","ranking","cham","tienda","bugs","ruleta"].indexOf(v) >= 0 && ["insignias","racha","ajustes","ranking","cham","tienda","bugs","ruleta"].indexOf(S.view) < 0) BACK = S.view; S.view = v; render(); window.scrollTo(0, 0); }
function cargarRanking(){
  api("/users/ranking").then(function(d){ S.ranking = d; render(); }).catch(function(e){ S.ranking = {error:e.message}; render(); });
}
function tick(){
  var p = S.play; if(!p || !p.running) return stopTimer();
  p.left = Math.max(0, p.left - 1);
  if(p.game === "speed"){
    var clock = document.getElementById("speedclock");
    if(clock) clock.textContent = p2(Math.floor(p.left / 60)) + ":" + p2(p.left % 60);
    if(p.left === 0){ p.running = false; stopTimer(); finishPlay(); }
    return;
  }
  var tot = p.min * 60, tt = document.getElementById("tt"), tm = document.getElementById("tm");
  if(tt) tt.textContent = String(Math.floor(p.left / 60)).padStart(2, "0") + ":" + String(p.left % 60).padStart(2, "0");
  if(tm) tm.style.setProperty("--p", Math.round((1 - p.left / tot) * 100) + "%");
  if(p.left === 0){ p.running = false; stopTimer(); confetti(); render(); }
}

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-a]");
  if(!b) return;
  var a = b.getAttribute("data-a"), m = b.getAttribute("data-m"), p = S.play;
  if(S.view === "done"){ var fd = document.getElementById("f-diary"); if(fd && fd.value.trim()) saveDiary(hoy(), fd.value.trim()); }
  if(a === "auth"){ S.mode = m; S.view = "auth"; S.err = ""; render(); }
  else if(a === "mode"){ S.mode = m; S.err = ""; render(); }
  else if(a === "back"){ S.view = "welcome"; S.err = ""; render(); }
  else if(a === "back2"){ go(BACK === "perfil" || BACK === "home" || BACK === "retos" || BACK === "stats" || BACK === "cal" ? BACK : "home"); }
  else if(a === "submit"){ submit(); }
  else if(a === "oauth"){ socialClick(m); }
  else if(a === "forgot"){ toast("La recuperación de contraseña debe configurarse con el correo del usuario."); }
  else if(a === "view"){
    var tab = b.getAttribute("data-tab");
    if(tab) S.jtab = tab;
    go(m);
  }
  else if(a === "drawer"){ S.drawer = !S.drawer; render(); }
  else if(a === "notif"){ toast(S.prefs.notif ? "Te avisaremos cuando tengas un reto nuevo" : "Activa las notificaciones en Configuración"); }
  else if(a === "sharechallenge"){
    var shareText = "¡Únete a mi reto semanal en Reto Diario! Mi objetivo es completar pequeños desafíos y subir de liga. ¿Te animas?";
    if(navigator.share){ navigator.share({title:"Reto Diario", text:shareText}).catch(function(){}); }
    else if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(shareText).then(function(){ toast("Texto de invitación copiado"); }).catch(function(){ prompt("Copia este mensaje para compartirlo:", shareText); }); }
    else { prompt("Copia este mensaje para compartirlo:", shareText); }
  }
  else if(a === "metago"){ if(m === "retos") S.jtab = "juegos"; go(m); }
  else if(a === "claimmetas"){
    var sm = shopGet(); if(sm.metas === hoy() || metasHoy().some(function(x){ return x.v < x.max; })) return;
    sm.metas = hoy(); sm.bonus = (sm.bonus || 0) + META_PREMIO; shopSave(sm); sfx("coin"); toast("+" + META_PREMIO + " monedas"); confetti();
  }
  else if(a === "bugstart"){ bugStart(); }
  else if(a === "spin"){ spinWheel(); }
  else if(a === "buy"){ shopBuy(m); }
  else if(a === "equip"){ shopEquip(m); }
  else if(a === "accon"){ shopAccToggle(m); }
  else if(a === "soon"){ S.drawer = false; toast(m === "tienda" ? "La tienda llegará pronto" : "Completa un reto al día para subir de nivel"); }
  else if(a === "pickcat"){ var c = S.prefs.cats.slice(), i = c.indexOf(m); if(i >= 0) c.splice(i, 1); else c.push(m); setPref("cats", c); render(); }
  else if(a === "skipob" || a === "finob"){ S.view = "home"; render(); }
  else if(a === "filtro"){ S.filtro = m; render(); }
  else if(a === "range"){ S.range = Number(m); render(); }
  else if(a === "play"){ startPlay(m, b.getAttribute("data-id"), b.getAttribute("data-g"), b.getAttribute("data-i")); }
  else if(a === "exit"){ stopTimer(); S.play = null; S.view = "home"; render(); }
  else if(a === "min"){ p.min = Number(m); p.left = p.min * 60; render(); }
  else if(a === "sel"){ p.sel = b.getAttribute("data-v"); render(); }
  else if(a === "timer"){ p.running = !p.running; stopTimer(); if(p.running) TI = setInterval(tick, 1000); var tb = document.getElementById("tb"); if(tb) tb.textContent = p.running ? "Pausar" : "Continuar"; }
  else if(a === "ans"){ if(p.answered) return; p.sel = b.getAttribute("data-v"); p.answered = true; if(p.sel === p.qs[p.step].a){ p.aciertos++; sfx("ok"); } else sfx("bad"); render(); }
  else if(a === "next"){
    if(p.cat === "cre" && !p.game){
      if(p.step === 0 && !p.drawn){ return toast("Dibuja algo primero"); }
      if(p.step === 1){ var fo = document.getElementById("f-obra"); p.nombre = fo ? fo.value : ""; }
    }
    playNext();
  }
  else if(a === "color"){ p.color = m; var cv = document.getElementById("cv"), keepDraw = p.drawn; document.querySelectorAll(".palette button[data-a=color]").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-m") === m); }); }
  else if(a === "clear"){ var cv2 = document.getElementById("cv"); if(cv2 && cv2.clearIt) cv2.clearIt(); }
  else if(a === "pref"){
    if(m === "notif" && !S.prefs.notif){
      if("Notification" in window && Notification.permission === "default"){ Notification.requestPermission().then(function(r){ setPref("notif", r === "granted"); if(r !== "granted") toast("Permiso de notificaciones no concedido"); render(); }); return; }
      if("Notification" in window && Notification.permission === "denied"){ return toast("Las notificaciones están bloqueadas en tu navegador"); }
    }
    setPref(m, !S.prefs[m]); render();
  }
  else if(a === "delacc"){
    if(confirm("¿Eliminar tu cuenta y todo tu progreso? Esta acción no se puede deshacer.")){
      api("/users/" + S.user.id, {method:"DELETE"}).then(function(){ logout(); }).catch(function(e){ toast(e.message); });
    }
  }
  else if(a === "flip"){
    var i = Number(m);
    if(p.lock || p.matched[i] || p.open.indexOf(i) >= 0) return;
    p.open.push(i); p.last = i; sfx("tap");
    if(p.open.length === 2){
      p.moves++;
      if(p.cards[p.open[0]].g === p.cards[p.open[1]].g){ p.matched[p.open[0]] = 1; p.matched[p.open[1]] = 1; p.open = []; sfx("coin"); }
      else { p.lock = true; setTimeout(function(){ if(S.play === p){ p.open = []; p.lock = false; render(); } }, 750); }
    }
    render();
  }
  else if(a === "mstep"){ p.checked[Number(m)] = !p.checked[Number(m)]; render(); }
  else if(a === "energy"){ energySet(m || null); render(); }
  else if(a === "calyear"){ S.calYear = !S.calYear; render(); }
  else if(a === "calmonth"){ S.calM = Number(m); S.calYear = false; S.sel = S.calY + "-" + p2(S.calM + 1) + "-01"; render(); }
  else if(a === "calynav"){ S.calY += Number(m); render(); }
  else if(a === "diarysave"){ var di = document.getElementById("f-diary"); saveDiary(S.sel, di ? di.value.trim() : ""); toast("Frase guardada"); }
  else if(a === "jtab"){ S.jtab = m; render(); }
  else if(a === "jt"){ S.jtab = m; go("retos"); }
  else if(a === "chk"){
    var inp = document.getElementById("f-ans"), val = ((inp && inp.value) || "").trim().toUpperCase();
    if(!val) return toast("Escribe una palabra");
    p.sel = val; p.answered = true; p.ok = val === p.words[p.step].w; render();
  }
  else if(a === "calnav"){ S.calM += Number(m); if(S.calM < 0){ S.calM = 11; S.calY--; } if(S.calM > 11){ S.calM = 0; S.calY++; } render(); }
  else if(a === "calday"){ S.sel = m; render(); }
  else if(a === "caltoday"){ calInit(); render(); }
  else if(a === "planadd"){
    var pi = document.getElementById("f-plan"), t = ((pi && pi.value) || "").trim();
    if(!t) return toast("Escribe tu plan");
    var pn = planes(); (pn[S.sel] = pn[S.sel] || []).push(t); save("plans_" + S.user.id, pn); render();
  }
  else if(a === "plandel"){ var pn2 = planes(); (pn2[S.sel] || []).splice(Number(m), 1); save("plans_" + S.user.id, pn2); render(); }
  else if(a === "logout"){ logout(); }
});
function logout(){ save("user", null); S.user = null; S.drawer = false; S.view = "welcome"; S.mode = "login"; render(); }
document.addEventListener("change", function(e){
  if(e.target && e.target.id === "f-foto" && e.target.files && e.target.files[0] && S.play){ S.play.foto = URL.createObjectURL(e.target.files[0]); render(); }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Enter" && S.view === "auth" && !S.busy) submit();
  if(e.key === "Enter" && S.view === "cal" && e.target.id === "f-plan"){ document.querySelector("[data-a=planadd]").click(); }
  if(e.key === "Enter" && S.view === "cal" && e.target.id === "f-diary"){ document.querySelector("[data-a=diarysave]").click(); }
  if(e.key === "Enter" && S.view === "play" && e.target.id === "f-ans" && S.play && !S.play.answered){ document.querySelector("[data-a=chk]").click(); }
});

if("serviceWorker" in navigator && location.protocol !== "file:"){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

var pr = load("prefs"); if(pr) S.prefs = Object.assign(S.prefs, pr);
applyPrefs();
var saved = load("user");
if(saved && saved.id){
  S.user = saved; S.view = "home";
  api("/users/" + saved.id).then(function(u){ S.user = u; save("user", u); render(); }, function(){});
  cargarRetos();
}
render();
oauthInit();
</script>
